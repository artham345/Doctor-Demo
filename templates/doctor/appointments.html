{% extends 'doctor/base.html' %}{% block content %}<section class="portal-card"><form class="filter-bar" method="post">{% csrf_token %}<div><label for="search">Search patient or reference</label><input class="form-control" id="search" name="q" value="{{ search }}" placeholder="Name or booking reference"></div><div><label for="filter-date">Date</label><input class="form-control" type="date" name="date" id="filter-date" value="{{ request.GET.date }}"></div><div><label for="filter-status">Status</label><select name="status" id="filter-status" class="form-select"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><button class="btn btn-primary" type="submit">Filter</button><a class="btn btn-light" href="{% url 'doctor-appointments' %}?clear=1">Clear</a></form>{% include 'includes/appointment_table.html' with appointments=page_obj %}{% include 'includes/pagination.html' %}</section>{% endblock %}
