<div class="service-grid">{% for service in services %}<article class="service-card"><span class="service-icon" aria-hidden="true">{% if service.icon == 'heart' %}♡{% elif service.icon == 'pulse' %}⌁{% elif service.icon == 'shield' %}◇{% else %}+{% endif %}</span><h3>{{ service.name }}</h3><p>{{ service.description }}</p><a href="{% url 'book' %}">Book a visit <span aria-hidden="true">↗</span></a></article>{% empty %}<div class="empty-state">Please contact the clinic to learn about our services.</div>{% endfor %}</div>
