databases:
  - name: clinic-db
    databaseName: clinic
    user: clinic
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    ipAllowList: []

envVarGroups:
  - name: clinic-shared
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: TRUST_PROXY
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: USE_S3
        value: "False"

services:
  - type: web
    name: clinic-web
    runtime: python
    plan: 0.5c-512mb
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /health/
    envVars:
      - fromGroup: clinic-shared
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
  - type: worker
    name: clinic-mail
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_notifications --watch
    envVars:
      - fromGroup: clinic-shared
      - key: SITE_URL
        fromService:
          type: web
          name: clinic-web
          envVarKey: SITE_URL
      - key: EMAIL_HOST
        fromService:
          type: web
          name: clinic-web
          envVarKey: EMAIL_HOST
      - key: EMAIL_HOST_USER
        fromService:
          type: web
          name: clinic-web
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: clinic-web
          envVarKey: EMAIL_HOST_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        fromService:
          type: web
          name: clinic-web
          envVarKey: DEFAULT_FROM_EMAIL
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
