# Free website only. Connect an existing Neon Free database.
services:
  - type: web
    name: clinic-web
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: TRUST_PROXY
        value: "True"
      - key: USE_S3
        value: "False"
      - key: USE_CLOUDINARY
        value: "False"
      - key: EMAIL_BACKEND
        value: notifications.gmail_backend.EmailBackend
      - key: EMAIL_SEND_IMMEDIATELY
        value: "True"
      - key: EMAIL_RETRY_TOKEN
        generateValue: true
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
